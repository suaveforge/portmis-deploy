name: PortMIS custom hostname verification
on:
  push:
    branches: [main]
    paths: [CNAME, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: read
jobs:
  dns:
    runs-on: [self-hosted, Linux, X64, server123, suaveforge-deploy, suaveforge-org]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure only PortMIS custom hostname using existing registrar workflow
        run: bash scripts/configure-frontend-dns.sh
      - name: Confirm custom hostname and actual HTTPS page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test "$(cat CNAME)" = portmis.suaveforge.com
          gh api "repos/$GITHUB_REPOSITORY/pages" --jq '{cname,https_enforced,certificate_state:(.https_certificate.state // "unknown")}'
          for i in $(seq 1 20); do
            if curl -fsS --max-time 10 https://portmis.suaveforge.com/ | grep -Fq 'PortMIS | Funafuti Port Operations'; then
              curl -fsS --max-time 15 https://portmis.suaveforge.com/app.js -o /tmp/portmis-pages-$GITHUB_RUN_ID.js
              cmp app.js /tmp/portmis-pages-$GITHUB_RUN_ID.js
              rm /tmp/portmis-pages-$GITHUB_RUN_ID.js
              echo PORTMIS_ROOT_HTTPS=PASS; exit 0
            fi
            sleep 15
          done
          exit 1
